name: Release

# Push a tag that matches manifest.json's version (e.g. 1.0.1, no "v") to publish a release with the
# three files Obsidian downloads: main.js, manifest.json and styles.css.
on:
  push:
    tags: ["*"]

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation (Sigstore, via GitHub OIDC)
  attestations: write  # store the attestation on the repo

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # runs the TypeScript tests natively
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the tag matches manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      # Build provenance: proves each asset was built from this repo, at this tag, by this workflow.
      # Check a download with: gh attestation verify main.js -R BlueBeard63/obsidian-projects-system
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
